<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css')}}"
        <title>{% block title %}Unique Cookies{% endblock %}</title>
    </head>
    <body>
        <header>
            <img src="/images/Cookie hero image.webp" alt="Stack of cookies on a table">
            <h1>Unique Cookies</h1>
           <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}">Home</a></li>
                    <li><a href="{{ url_for('about')}}">About Us</a></li>
                    <li><a href="{{ url_for('order_history')}}">Order History</a></li>
                    <li><a href="{{ url_for('invoice')}}">Invoice</a></li>
                </ul>
            </nav>
        </header>
        <main>
            {% block content %}
            {% endblock %}
        </main>
        <footer>&copy; Unique Cookies 2026</footer>
    </body>
</html>
